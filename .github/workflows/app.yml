name: tests and app

on:
  push:
    branches: [main]
    tags: ['app-v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.2'
      - name: Kit tests
        shell: bash
        run: |
          cd kit/mcp && uv run --no-project --with pytest --with "mcp==2.3.0" python -m pytest tests -q
          cd ../setup && uv run --no-project --with pytest python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: App tests
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  installers:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            uv: win-x64
          - os: macos-latest
            args: --mac
            uv: mac-arm64 mac-x64
          - os: ubuntu-latest
            args: --linux
            uv: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the installer
        working-directory: app
        shell: bash
        run: |
          npm ci
          node scripts/prepare-resources.mjs ${{ matrix.uv }}
          npx electron-vite build
          npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg
            app/dist/*.AppImage
            app/dist/*.deb
          if-no-files-found: error

  release:
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Draft release with the installers (publish it on GitHub when it looks right)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: WoP Server ${{ github.ref_name }}
          files: installers/*
