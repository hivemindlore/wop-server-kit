appId: io.github.hivemindlore.wopserverkit
productName: WoP Server
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # World of PADMAN's logo for the app window (build/icon.* are the installer and app icons). © PadWorld Entertainment,
  # used with credit for this free World of PADMAN tool, as their terms allow (COPYING.md in their repository).
  - from: build/icon.png
    to: icon.png
  - from: resources/kit
    to: kit
    filter: ["**/*", "!**/__pycache__/**", "!**/tests/**", "!**/test_*.py"]
# Installers are attached to a draft GitHub release by .github/workflows/app.yml (tags app-v*)
publish: null

win:
  target: nsis
  extraResources:
    - from: resources/uv/win-x64
      to: uv/win-x64
nsis:
  artifactName: WoP-Server-Setup-${version}.${ext}
  oneClick: true
  perMachine: false          # no admin rights needed to install
  createDesktopShortcut: always
  shortcutName: WoP Server

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.games
  artifactName: WoP-Server-${version}-${arch}.${ext}
  # Not signed with an Apple Developer ID yet; an ad-hoc signature is the least an Apple-silicon Mac runs
  identity: "-"
  extraResources:
    - from: resources/uv/mac-arm64
      to: uv/mac-arm64
    - from: resources/uv/mac-x64
      to: uv/mac-x64

linux:
  target: [AppImage, deb]
  category: Game
  artifactName: WoP-Server-${version}-${arch}.${ext}
  maintainer: WoP Server Kit <hivemindlore@users.noreply.github.com>
  extraResources:
    - from: resources/uv/linux-x64
      to: uv/linux-x64
