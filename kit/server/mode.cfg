//
//    WoP server - switch game mode (for people who like typing; asking Claude is easier)
//
//    1. Copy a block from gamemodes.md and paste it over everything below the line
//    2. Change the map / bot names if you want, then save this file
//    3. Type  exec mode.cfg  in the server window
//       (or  /rcon exec mode.cfg  in the game console)
//
//    The mode keeps replaying until you switch again or restart the server.
//    Restarting the server always goes back to the startup game.
//
// ---------------------------------------------------------------------------

// Team Free For All | Red 6 vs Blue 3 | Regular weapons | wop_padgarden
kick allbots
set bot_minplayers 0
set g_gametype 6
set g_instaPad 0
set pointlimit 64
set timelimit 16
map wop_padgarden
addbot padman    3 red
addbot padgirl   3 red
addbot padlilly  3 red
addbot paddybell 3 red
addbot pelvis    3 red
addbot piratepad 3 red
addbot fatpad    3 blue
addbot fatpad    3 blue 0 "FatPad2"
addbot fatty     3 blue
