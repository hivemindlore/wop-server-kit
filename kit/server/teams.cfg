//
//    WoP server - team lineup
//
//    Loaded automatically when the server starts. Easiest way to change it:
//    ask Claude ("put 4 bots on each team", then "keep this as the startup game").
//
//    To remove a bot from the lineup, put // in front of its line.
//    Format:  addbot <botname> <skill 1-5> <red|blue|free> [delay ms] ["custom name"]
//    Adding the same bot twice? Give the second one its own name, like FatPad2 below.
//
//    Humans pick their own team with /team red or /team blue (or the Esc menu).
//

// Remove all bots first so reloading this file never creates duplicates
kick allbots

//
// RED PADS (red): 6 bots, one of each AI personality
//
addbot PADMAN      3 red
addbot PadGirl     3 red
addbot PadLilly    3 red
addbot PaddyBell   3 red
addbot Pelvis      3 red
addbot PiratePad   3 red

//
// BLUE NOSES (blue): 3 bots
//
addbot FatPad      3 blue
addbot FatPad      3 blue 0 "FatPad2"
addbot FATTY       3 blue
