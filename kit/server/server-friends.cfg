//
//    World of PADMAN LAN server - made by the WoP Server Kit
//
//    The easiest way to change anything: ask Claude (Claude Desktop is connected
//    to this server). You can also edit this file with Notepad / TextEdit and
//    restart the server. Builds on the example configs shipped with WoP 1.7.0.
//

// Load the bundled defaults (this also runs rotation.cfg)
exec "server-settings.cfg"

//
// Server name and message (^1-^7 are color codes)
//
set sv_hostname "__SERVER_NAME__"
set g_motd      "^7Welcome! Have fun."

//
// Players and bots
//
// Total slots, humans + bots (the startup lineup in teams.cfg uses 9)
set sv_maxclients    "16"
// Max players actually playing (rest must spectate). 0 = no limit
set g_maxGameClients "0"
set bot_enable       "1"
// No random filler bots; the lineup in teams.cfg (or what Claude sets up) is used
set bot_minplayers   "0"
// Bot skill 1-5
set g_spSkill        "3"
// 1 = bots don't chat
set bot_nochat       "0"

//
// Passwords
//
// Remote administration; used by the Claude connection. Made randomly for this computer.
set rconpassword "__RCON_PASSWORD__"
// Set this to require a password to join (players then use /password <pw>)
set g_password   ""

//
// Gameplay
//
set g_allowVote        "1"
set g_doWarmup         "1"
set g_warmup           "30"
set g_friendlyFire     "0"
// 1 = put new players on a team automatically
set g_teamAutoJoin     "0"
// 1 = don't let players join the bigger team
set g_teamForceBalance "0"
// 1 = instagib: everyone has one instant-kill weapon
set g_instaPad         "0"
// Lives per player in Last Pad Standing
set g_LPS_startlives   "10"

//
// Server settings
//
set sv_pure          "1"
set sv_allowdownload "0"
set g_log            "games.log"

//
// Startup game, with the bot lineup from teams.cfg. When a match ends the same map restarts.
// Claude's save_as_startup rewrites everything between the two marker lines;
// keep the markers if you edit this by hand.
//
// >>> startup game
// Team Free For All on wop_padgarden, 6 Red Pads vs 3 Blue Noses
set g_gametype     "6"
set bot_minplayers "0"
set g_instaPad     "0"
set pointlimit     "64"
set timelimit      "16"
map wop_padgarden
exec teams.cfg
// <<< startup game
